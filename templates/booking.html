{% extends 'base.html' %}
{% block title %}Booking{% endblock %}
{% block content %}
<main>
    <h2>Booking Form</h2>
    <p>Request a screening, talk or appearance.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Send Booking Request</button>
    </form>
</main>
{% endblock %}
